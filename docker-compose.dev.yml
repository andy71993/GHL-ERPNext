version: "3.8"

# Development override - use this for local development
# Run with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  # Simple ERPNext for development (using frappe_docker easy install)
  erpnext-dev:
    image: frappe/erpnext:v15
    container_name: ghl-erpnext-dev
    ports:
      - "8000:8000"
      - "9000:9000"
    environment:
      - FRAPPE_SITE_NAME_HEADER=localhost
      - DEVELOPER_MODE=1
    volumes:
      - erpnext-dev-sites:/home/frappe/frappe-bench/sites
    depends_on:
      - mariadb-dev
      - redis-dev
    networks:
      - ghl-dev-network
    command: >
      bash -c "
        bench new-site localhost --mariadb-root-password=admin --admin-password=admin --db-type=mariadb --no-mariadb-socket || true
        bench --site localhost install-app erpnext || true
        bench --site localhost install-app hrms || true
        bench --site localhost enable-scheduler
        bench start
      "

  mariadb-dev:
    image: mariadb:10.6
    container_name: ghl-mariadb-dev
    environment:
      - MYSQL_ROOT_PASSWORD=admin
      - MYSQL_DATABASE=erpnext
    volumes:
      - mariadb-dev-data:/var/lib/mysql
    ports:
      - "3307:3306"
    networks:
      - ghl-dev-network

  redis-dev:
    image: redis:7-alpine
    container_name: ghl-redis-dev
    ports:
      - "6379:6379"
    networks:
      - ghl-dev-network

networks:
  ghl-dev-network:
    driver: bridge

volumes:
  erpnext-dev-sites:
  mariadb-dev-data:
